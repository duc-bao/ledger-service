services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    command: ["postgres", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ledger-redis
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ledger-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-service
    ports:
      - "8080:8091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: ledger_user
      SPRING_DATASOURCE_PASSWORD: ledger_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-suW1MFuErxKmhelwTpwhw6QaAoqZMRb64y81cR9rYeA}
      JWT_REFRESH_KEY: ${JWT_REFRESH_KEY:-WDzqnd5bXrUvjuzzLagE0Vc5BppnVvKVv3rrie5xkmk}
      APP_SUPER_USER: ${APP_SUPER_USER:-admin}
      APP_SUPER_PASSWORD: ${APP_SUPER_PASSWORD:-123456a@}
      CORS_ALLOWED_ORIGIN_1: ${CORS_ALLOWED_ORIGIN_1:-https://ob-consent.savyint.com}
      CORS_ALLOWED_ORIGIN_2: ${CORS_ALLOWED_ORIGIN_2:-https://iam-uat.savyint.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    container_name: ledger-minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # Port cho API S3
      - "9001:9001" # Port cho giao diện Web UI (MinIO Console)
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  redis_data:
  minio_data:
